<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linkshelf</title>
<meta name="description" content="A Linkshelf link page.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Fraunces:ital,wght@1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shelf.css">
<style>
  html, body { margin: 0; min-height: 100%; height: 100%; }
  body { background: #2B3BFF; }
  #shelf { min-height: 100vh; }
  .state {
    min-height: 100vh; display: grid; place-items: center; text-align: center;
    padding: 24px; font-family: "Bricolage Grotesque", system-ui, sans-serif;
    background: #F1F0FA; color: #16163A;
  }
  .state h1 { font-size: 2rem; margin: 0 0 8px; font-variation-settings: "wdth" 80; }
  .state p { margin: 0 0 20px; color: #4A4A6E; }
  .state a { color: #2B3BFF; font-weight: 700; }
  .loading { opacity: .6; }
</style>
<!-- Pinned version + integrity hash: the browser refuses the file if the CDN ever serves anything else. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<script src="shared.js"></script>
</head>
<body>
<main id="shelf"><div class="state loading"><p>Loading…</p></div></main>

<script>
(async () => {
  const root = document.getElementById("shelf");
  const username = (new URLSearchParams(location.search).get("u") || "").toLowerCase().trim();

  function showState(title, text) {
    root.className = "";
    root.replaceChildren(el("div", { class: "state" },
      el("div", {},
        el("h1", { text: title }),
        el("p", { text: text }),
        el("a", { href: "index.html", text: "Make your own Linkshelf page" }))));
    document.body.style.background = "#F1F0FA";
  }

  if (!isConfigured) return showState("Not connected yet", "This Linkshelf isn't connected to its database yet.");
  if (!/^[a-z0-9_]{3,24}$/.test(username)) return showState("Page not found", "This link is missing a valid username.");

  try {
    const { data: profile, error } = await db.from("profiles").select("id, username, display_name, bio, theme").eq("username", username).maybeSingle();
    if (error) throw error;
    if (!profile) {
      // Maybe it's someone's old username: send visitors to their new one.
      const { data: old } = await db.from("username_history").select("user_id").eq("username", username).maybeSingle();
      if (old) {
        const { data: now } = await db.from("profiles").select("username").eq("id", old.user_id).maybeSingle();
        if (now) return location.replace("page.html?u=" + encodeURIComponent(now.username));
      }
      return showState("Page not found", "Nobody has claimed @" + username + " yet. It could be yours.");
    }

    const { data: links, error: e2 } = await db.from("links").select("id, title, url").eq("user_id", profile.id).order("position").order("created_at");
    if (e2) throw e2;

    document.title = (profile.display_name || "@" + profile.username) + " | Linkshelf";
    const meta = document.querySelector('meta[name="description"]');
    if (meta && profile.bio) meta.setAttribute("content", profile.bio);
    renderShelf(root, profile, links || []);
    document.body.style.background = getComputedStyle(root).backgroundColor;
  } catch (err) {
    showState("Couldn't load this page", "Check your connection and refresh the page.");
  }
})();
</script>
</body>
</html>
